<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monitor Permintaan Barang</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f27;--mu:#6b7280;--bd:#e3e6eb;--pr:#2563eb;--lk:#0a84ff;--ok:#15803d;--no:#b91c1c;--wa:#b45309;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--card:#1e2128;--tx:#e8eaee;--mu:#9aa1ad;--bd:#2e333c;--pr:#60a5fa;--lk:#4db2ff;--ok:#4ade80;--no:#f87171;--wa:#fbbf24}}
:root[data-theme="dark"]{--bg:#14161a;--card:#1e2128;--tx:#e8eaee;--mu:#9aa1ad;--bd:#2e333c;--pr:#60a5fa;--lk:#4db2ff;--ok:#4ade80;--no:#f87171;--wa:#fbbf24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;display:flex;flex-direction:column;min-height:100vh;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--bd)}
h1{font-size:16px;margin:0}
select,input,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 10px}
button{cursor:pointer}button.p{background:var(--pr);border-color:var(--pr);color:#fff}
button.ok{color:var(--ok);border-color:var(--ok)}button.no{color:var(--no);border-color:var(--no)}
td button{padding:2px 10px;font-size:12px;line-height:1.5;border-radius:99px;white-space:nowrap}
td .tag{display:inline-block;line-height:1.5}
td .tag,td button{vertical-align:middle}
a{color:var(--lk);font-weight:600;text-decoration:none}a:hover{text-decoration:underline}
button{transition:background .12s,color .12s,border-color .12s,transform .05s}button:active{transform:scale(.97)}
button.p:hover{filter:brightness(1.12)}button.p:active{filter:brightness(.82)}
button.ok:hover{background:color-mix(in srgb,var(--ok) 14%,transparent)}button.ok:active{background:var(--ok);color:#fff}
button.no:hover{background:color-mix(in srgb,var(--no) 14%,transparent)}button.no:active{background:var(--no);color:#fff}
button.tt:hover{border-color:var(--no);color:var(--no)}button.tt:active{background:var(--no);border-color:var(--no);color:#fff}
button.cp:hover{background:color-mix(in srgb,var(--pr) 14%,transparent);border-color:var(--pr);color:var(--pr)}button.cp:active{background:var(--pr);border-color:var(--pr);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}.pg button{padding:4px 10px;font-size:13px}input[type=search]{min-width:0}
.lamp-i{display:flex;gap:10px;align-items:center;margin:6px 0}.lamp-i img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--bd);display:block}.lamp-f{font-size:34px;width:64px;text-align:center;text-decoration:none}
.nf input:not([type=checkbox]),.nf select{width:100%}
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}.subnav button{padding:4px 12px;font-size:13px;border-radius:99px}.subnav button.on{background:var(--pr);border-color:var(--pr);color:#fff}
nav{display:flex;gap:6px;padding:10px 16px}nav button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
main{padding:0 16px 24px;max-width:1000px;width:100%;margin:0 auto;flex:1}
footer{text-align:center;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));color:var(--mu);font-size:12px;border-top:1px solid var(--bd);margin-top:8px}footer a{font-size:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}.c b{display:block;font-size:22px}.c span{color:var(--mu);font-size:12px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:14px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:560px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);vertical-align:top}th{color:var(--mu);font-weight:600;font-size:12px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;border:1px solid var(--bd);white-space:nowrap}
.t-ok{color:var(--ok);border-color:var(--ok)}.t-no{color:var(--no);border-color:var(--no)}.t-wa{color:var(--wa);border-color:var(--wa)}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal>div{background:var(--card);border-radius:12px;padding:16px;width:100%;max-width:480px;max-height:90%;overflow:auto}
/* jendela detail lebar: menyesuaikan layar, bisa ditarik lebarnya di desktop */
.modal>div.wide{width:1000px;max-width:96vw;min-width:min(520px,96vw);max-height:92%;resize:horizontal;overflow:auto}
.modal>div.wide table{min-width:0}
label{display:block;margin:8px 0 2px;color:var(--mu);font-size:12px}.modal input,.modal select{width:100%}
.line{display:grid;grid-template-columns:1fr 80px 28px;gap:6px;margin-bottom:6px}
.mu{color:var(--mu);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>📦 Monitor Permintaan Barang</h1>
  <div id="who"></div>
</header>
<nav id="nav"></nav>
<main id="app"></main>
<footer id="ft"></footer>
<div id="modal"></div>
<script>
const EXPECT=24; // harus sama dengan VERSION di server.js
const $=id=>document.getElementById(id);
const ROLES=['EDP','Admin','Supervisor','Manager','BFM'],CHAIN=['Supervisor','Manager','BFM'];
const chainOf=r=>r.chain||CHAIN;
const curChain=()=>(S.config&&S.config.chain)||CHAIN;
const rp=n=>'Rp\u00a0'+Number(n||0).toLocaleString('id-ID');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={me:null,issues:[],items:[],reqs:[],users:[],tab:'dash'};
async function api(p,b){
 const r=await fetch('/api/'+p,b===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
 const j=await r.json().catch(()=>({}));
 if(r.status===404)throw new Error('Server belum diperbarui (fitur ini belum tersedia pada deployment). Deploy ulang project Vercel dengan versi terbaru.');
 if(r.status===403&&j.err==='IP_TIDAK_DIIZINKAN'){S.me=null;S.ipblock=true;S.expired=false;render();throw new Error('Alamat IP komputer ini tidak diizinkan untuk akun tersebut.')}
 if(r.status===401&&p!=='login'){S.me=null;S.expired=true;render();throw new Error('Sesi berakhir, silakan login lagi')}
 if(!r.ok)throw new Error(j.err||'Gagal');return j}
async function load(bg){try{Object.assign(S,await api(bg?'state?bg=1':'state'))}catch(e){S.me=null}render()}
async function run(f){try{await f();await load();return true}catch(e){alert(e.message);return false}}
setInterval(()=>{if(S.me&&!$('modal').innerHTML&&S.tab!=='users'&&S.tab!=='set'&&!['INPUT','SELECT','TEXTAREA'].includes((document.activeElement||{}).tagName))load(true)},15000);
async function login(){try{await api('login',{user:$('lu').value,pass:$('lp').value});S.expired=false;S.ipblock=false;S.tab='dash';await load()}catch(e){$('lerr').textContent=e.message}}
async function logout(){try{await api('logout',{})}catch(e){}S.me=null;render()}
const total=r=>r.lines.reduce((a,l)=>l.rej?a:a+l.qty*l.harga,0);
function status(r){if(r.canceled)return['Dibatalkan','t-no'];if(r.rejected)return['Ditolak','t-no'];return r.step>=chainOf(r).length?['Disetujui','t-ok']:['Menunggu '+chainOf(r)[r.step],'t-wa']}
const isStaff=()=>['EDP','Admin'].includes(S.me.role);
const canAct=r=>!r.rejected&&!r.canceled&&r.step<chainOf(r).length&&chainOf(r)[r.step]===S.me.role;
const TAS="width:100%;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 10px";
function act(id,ok){const r=S.reqs.find(x=>x.id===id);
 if(!ok){openModal(`<h3>Tolak ${id}</h3><p class="mu">Semua barang yang masih aktif pada permintaan ini akan ditolak.</p><label>Alasan penolakan (wajib)</label><textarea id="an" rows="3" style="${TAS}"></textarea><div class="bar" style="margin-top:12px"><button class="tt" onclick="closeModal()">Batal</button><button class="no" onclick="doAct('${id}',false)">Tolak Semua</button></div>`);return}
 const rows=r.lines.map((l,i)=>l.rej?'':`<label style="display:flex;gap:8px;align-items:center;margin:6px 0;color:var(--tx);font-size:14px"><input type="checkbox" class="apc" value="${i}" checked style="width:auto"> ${esc(l.nama)} — ${l.qty} ${esc(l.satuan)} · ${rp(l.qty*l.harga)}</label>`).join('');
 openModal(`<h3>Approve ${id}</h3><p class="mu">Centang barang yang disetujui. Barang yang <b>tidak dicentang akan ditolak</b> (alasan wajib diisi).</p>${rows}<label>Catatan (opsional jika semua disetujui)</label><textarea id="an" rows="3" style="${TAS}"></textarea><div class="bar" style="margin-top:12px"><button class="tt" onclick="closeModal()">Batal</button><button class="ok" onclick="doAct('${id}',true)">Approve</button></div>`)}
function doAct(id,ok){const cat=$('an').value.trim(),r0=S.reqs.find(x=>x.id===id),rv=(r0&&r0.rev||[]).length;
 const ap=ok?[...document.querySelectorAll('.apc:checked')].map(x=>+x.value):[],tot=ok?document.querySelectorAll('.apc').length:0;
 if((!ok||ap.length<tot)&&!cat)return alert('Alasan penolakan wajib diisi (ada barang yang tidak disetujui)');
 if(ok&&ap.length>0&&needOtp()){window.pend={id,cat,ap,rv};return askOtp()}
 run(async()=>{try{await api('act',{id,ok:ok&&ap.length>0,cat,approve:ap,rv})}catch(e){if(e.message==='OTP_DIBUTUHKAN'){window.pend={id,cat,ap,rv};await askOtp();return}throw e}closeModal()})}
const needOtp=()=>!!(S.config&&S.config.otp&&S.config.otp[S.me.role]);
async function askOtp(){try{const r=await api('otp/request',{id:pend.id});showOtp(r)}catch(e){if(/tidak memakai OTP/.test(e.message)){return run(async()=>{await api('act',{id:pend.id,ok:true,cat:pend.cat,approve:pend.ap,rv:pend.rv});closeModal()})}alert(e.message)}}
function showOtp(r){openModal(`<h3>🔐 Kode OTP</h3><p>Kode 6 digit dikirim ke <b>${esc(r.sent.join(' &amp; '))}</b> Anda. Berlaku ${Math.round(r.ttl/60)} menit.</p><label>Masukkan kode OTP</label><input id="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" style="font-size:22px;letter-spacing:8px;text-align:center"><div class="bar" style="margin-top:12px"><button class="tt" onclick="closeModal()">Batal</button><span><button onclick="askOtp()">Kirim ulang</button> <button class="ok" onclick="confirmOtp()">Konfirmasi Approve</button></span></div>`)}
function confirmOtp(){const code=$('otp').value.trim();if(!/^\d{6}$/.test(code))return alert('Masukkan 6 digit kode OTP');
 run(async()=>{await api('act',{id:pend.id,ok:true,cat:pend.cat,approve:pend.ap,rv:pend.rv,otp:code});closeModal()})}
function openModal(h,w){$('modal').innerHTML='<div class="modal"><div'+(w?' class="wide"':'')+'>'+h+'</div></div>'}
const closeModal=()=>$('modal').innerHTML='';
const btns=(f)=>`<div class="bar" style="margin-top:12px"><button class="tt" onclick="closeModal()">Batal</button><button class="p" onclick="${f}">Simpan</button></div>`;
function itemForm(i){const it=i>=0?S.items[i]:{kode:'',nama:'',satuan:'',harga:''};
 openModal(`<h3>${i>=0?'Edit':'Tambah'} Barang</h3>`+(i>=0?`<label>Kode</label><input value="${esc(it.kode)}" disabled>`:'<p class="mu">Kode dibuat otomatis dan stok awal 0.</p>')+`<label>Nama Barang</label><input id="f2" value="${esc(it.nama)}"><label>Satuan</label><input id="f3" value="${esc(it.satuan)}"><label>Harga Acuan (otomatis ikut harga beli terakhir)</label><input id="f4" type="number" min="0" value="${it.harga}"><p class="mu">Stok tidak bisa diedit manual: bertambah otomatis saat realisasi pembelian.</p>`+btns(`saveItem(${i})`))}
function saveItem(i){const v=n=>$('f'+n).value.trim();
 run(async()=>{await api('item',{idx:i,item:{nama:v(2),satuan:v(3),harga:+v(4)||0}});closeModal()})}
function reqForm(){if(!S.items.length)return alert('Master barang masih kosong');window.tmp=[{k:0,qty:1}];window.editId=null;window.rk='';drawReq()}
function updTot(){$('rtot').textContent=rp(tmp.reduce((a,l)=>a+l.qty*S.items[l.k].harga,0))}
function drawReq(){
 const opts=S.items.map((x,k)=>`<option value="${k}">${esc(x.nama)} - ${rp(x.harga)}</option>`).join('');
 const tot=tmp.reduce((a,l)=>a+l.qty*S.items[l.k].harga,0);
 openModal(`<h3>${window.editId?'Ubah Permintaan '+window.editId:'Permintaan Pembelian Baru'}</h3><label>Keperluan</label><input id="rk" value="${esc(window.rk||'')}" oninput="window.rk=this.value"><label>Barang</label>`+
 tmp.map((l,n)=>`<div class="line"><select onchange="tmp[${n}].k=+this.value;drawReq()">${opts.replace(`value="${l.k}"`,`value="${l.k}" selected`)}</select><input type="number" min="1" value="${l.qty}" oninput="tmp[${n}].qty=Math.max(1,+this.value||1);updTot()"><button onclick="tmp.splice(${n},1);drawReq()">✕</button></div>`).join('')+
 `<button onclick="tmp.push({k:0,qty:1});drawReq()">+ Tambah baris</button><p><b>Total: <span id="rtot">${rp(tot)}</span></b><br><span class="mu">Alur: ${curChain().join(' → ')}</span></p><div class="bar"><button class="tt" onclick="closeModal()">Batal</button><button class="p" onclick="sendReq()">${window.editId?'Simpan Perubahan':'Ajukan'}</button></div>`)}
function sendReq(){const eid=window.editId;run(async()=>{await api(eid?'req/edit':'req',{id:eid,ket:window.rk||'',lines:tmp.map(l=>({kode:S.items[l.k].kode,qty:l.qty}))});window.rk='';window.editId=null;closeModal();if(!eid)S.tab='req'}).then(ok=>ok&&eid&&detail(eid))}
const isOwn=r=>r.byUser?r.byUser===S.me.user:r.by===S.me.role;
const canEditR=r=>(isOwn(r)||S.me.role==='EDP')&&!r.rejected&&!r.canceled&&r.log.length===0;
const canCancelR=r=>(isOwn(r)||S.me.role==='EDP')&&!r.rejected&&!r.canceled&&r.step<chainOf(r).length;
function editReq(id){const r=S.reqs.find(x=>x.id===id);
 const t0=r.lines.map(l=>{let k=S.items.findIndex(x=>x.kode===l.kode);if(k<0)k=S.items.findIndex(x=>x.nama===l.nama);return k<0?null:{k,qty:l.qty}}).filter(Boolean);
 if(t0.length!==r.lines.length)return alert('Sebagian barang pada permintaan ini sudah tidak ada di Master Barang. Batalkan lalu buat permintaan baru.');
 window.tmp=t0;window.rk=r.ket==='-'?'':r.ket;window.editId=id;drawReq()}
function cancelReq(id){openModal(`<h3>Batalkan ${id}</h3><p class="mu">Permintaan dibatalkan dan tidak dilanjutkan ke penyetuju.</p><label>Alasan pembatalan (wajib)</label><input id="cr" autocomplete="off"><div class="bar" style="margin-top:12px"><button class="tt" onclick="closeModal()">Tidak jadi</button><button class="no" onclick="doCancel('${id}')">Batalkan Permintaan</button></div>`)}
function doCancel(id){const a=$('cr').value.trim();if(!a)return alert('Alasan pembatalan wajib diisi');run(async()=>{await api('req/cancel',{id,alasan:a});closeModal()}).then(ok=>ok&&detail(id))}
const apSt=g=>g.ok?(g.rj&&g.rj.length?'Disetujui sebagian':'Disetujui'):'Ditolak';
const apNote=(r,g)=>((g.rj&&g.rj.length?'Barang ditolak: '+g.rj.map(i=>(r.lines[i]||{}).nama).join(', ')+'. ':'')+(g.cat&&g.cat!=='-'?g.cat:'')).trim();
const isApproved=r=>!r.rejected&&r.step>=chainOf(r).length;
const done=(r,i)=>(r.real||[]).reduce((a,e)=>a+((e.items.find(x=>x.i===i)||{}).qty||0),0);
function realSt(r){const q=r.lines.reduce((a,l)=>l.rej?a:a+l.qty,0),d=r.lines.reduce((a,l,i)=>a+done(r,i),0);
 return d>=q?['Sudah direalisasi','t-ok',0]:d>0?['Sebagian','t-wa',q-d]:['Belum direalisasi','t-wa',q-d]}
const doneV=(r,i)=>(r.real||[]).reduce((a,e)=>{const x=e.items.find(x=>x.i===i);return a+(x?x.qty*(x.harga??r.lines[i].harga):0)},0);
const realTotal=r=>r.lines.reduce((a,l,i)=>a+doneV(r,i),0);
const selTotal=r=>realTotal(r)-r.lines.reduce((a,l,i)=>a+done(r,i)*l.harga,0);
const fmtSel=n=>n===0?'-':`<span style="color:${n>0?'var(--no)':'var(--ok)'}">${n>0?'▲\u00a0+':'▼\u00a0−'}${rp(Math.abs(n))}</span>`;
function realForm(id){const r=S.reqs.find(x=>x.id===id);
 openModal(`<h3>Catat Realisasi ${r.id}</h3><p class="mu">Isi jumlah yang sudah dibeli dan harga satuan sebenarnya saat membeli (bisa berbeda dari harga yang diminta).</p>`+
 r.lines.map((l,i)=>{const sisa=l.qty-done(r,i);return sisa>0&&!l.rej?`<label>${esc(l.nama)} — sisa ${sisa} ${esc(l.satuan)}, harga diminta ${rp(l.harga)}</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><input id="rq${i}" type="number" min="0" max="${sisa}" value="${sisa}" title="Jumlah dibeli"><input id="rh${i}" type="number" min="0" value="${l.harga}" title="Harga satuan realisasi"></div><div class="mu">Kiri: jumlah dibeli · Kanan: harga satuan realisasi</div>`:''}).join('')+
 `<label>No. PO / Nota / Referensi</label><input id="rr"><label>Catatan</label><input id="rn"><label>Lampiran nota/PO (opsional, boleh lebih dari satu)</label><input id="rl-f" type="file" multiple accept="${LAMP_ACC}"><label>Jenis lampiran</label><select id="rl-j"><option>Nota</option><option>PO</option><option>Penawaran</option><option>Lainnya</option></select>`+btns(`saveReal('${id}')`))}
function saveReal(id){const r=S.reqs.find(x=>x.id===id);
 const items=r.lines.map((l,i)=>({i,qty:$('rq'+i)?+$('rq'+i).value||0:0,harga:$('rh'+i)&&$('rh'+i).value!==''?+$('rh'+i).value:null})).filter(x=>x.qty>0);
 run(async()=>{const files=[...($('rl-f')?$('rl-f').files:[])],jn=$('rl-j')?$('rl-j').value:'Nota';const r=await api('real',{id,items,ref:$('rr').value,note:$('rn').value});
  if(files.length){try{await uploadAll(id,'realisasi',r.idx,files,jn,'')}catch(e){alert('Realisasi sudah tersimpan, tetapi lampiran gagal: '+e.message+'\nTambahkan lampiran lagi dari detail permintaan.')}}}).then(ok=>ok&&detail(id))}
function detail(id){const r=S.reqs.find(x=>x.id===id),ap=isApproved(r);
 openModal(`<h3>${r.id}</h3><p class="mu">${r.tgl} · ${esc(r.byNama||r.by)} · ${esc(r.ket)}</p>${lineTbl(r)}${ap?'<div class="mu">Selisih = harga beli dibanding harga diminta (▲ lebih mahal, ▼ lebih murah)</div>':''}<p><b>Status:</b> ${status(r)[0]}${ap?' · Realisasi: '+realSt(r)[0]:''}</p>${r.canceled?`<p style="color:var(--no)"><b>Dibatalkan</b> oleh ${esc(r.canceled.nama||r.canceled.user)} (${esc(r.canceled.at)}): ${esc(r.canceled.alasan)}</p>`:''}${(r.rev&&r.rev.length)?`<p class="mu">Diubah ${r.rev.length}× · terakhir ${esc(r.rev[r.rev.length-1].at)} oleh ${esc(r.rev[r.rev.length-1].nama||'')}</p>`:''}<b>Persetujuan</b>${approvalTbl(r,false)}<p><b>📎 Lampiran permintaan</b></p>${lampHtml(r,'permintaan')}`+
 (ap?`<p><b>Riwayat Realisasi</b></p>`+((r.real||[]).map((e,ei)=>`<div class="mu">${e.at} — ${esc(e.nama||e.user)}: ${e.items.map(x=>esc(r.lines[x.i].nama)+' ×'+x.qty+' @ '+rp(x.harga??r.lines[x.i].harga)).join(', ')}${e.ref?' · Ref: '+esc(e.ref):''}${e.note?' · '+esc(e.note):''}</div>${lampHtml(r,'realisasi',ei)}`).join('')||'<div class="mu">Belum ada pembelian tercatat</div>'):'')+

const PGS=10,PV={mon:{q:'',st:'all',p:1},req:{q:'',st:'all',p:1},real:{q:'',st:'all',p:1},out:{q:'',st:'all',p:1},mst:{q:'',st:'all',p:1}};

function repSum(list){

 return `<h4>Ringkasan Barang</h4><table><tr><th>Barang</th><th>Satuan</th><th>Total Qty</th>${sh?'<th>Terealisasi</th><th>Sisa</th>':''}<th>Jml Permintaan</th><th>Nilai Diminta</th>${sh?'<th>Nilai Realisasi</th><th>Selisih</th>':''}</tr>`+

  h=`<div class="box"><div class="bar"><b>Laporan</b><span><button class="ok" onclick="exportXlsx(false)" title="Kategori yang sedang dibuka">📊 Export Excel</button> <button class="ok" onclick="exportXlsx(true)" title="Semua kategori dalam satu file">📚 Export Semua</button> <button class="p" onclick="printRep()">🖨 Cetak</button></span></div><div class="subnav">${SUBS.map(([k,t])=>`<button class="${RF.sub===k?'on':''}" onclick="setSub('${k}')">${t}</button>`).join('')}</div><div class="bar" style="justify-content:flex-start"><input id="sq-lap" type="search" placeholder="🔍 Cari di laporan…" value="${esc(RF.q)}" oninput="searchLap(this.value)" style="flex:1;min-width:180px">${isOut?'':`<select onchange="RF.st=this.value;render()">${Object.entries(STL).map(([k,t])=>`<option value="${k}" ${RF.st===k?'selected':''}>${t}</option>`).join('')}</select> `}Dari <input type="date" value="${RF.d1}" onchange="RF.d1=this.value;render()"> s/d <input type="date" value="${RF.d2}" onchange="RF.d2=this.value;render()"></div><div class="mu" style="margin-bottom:8px">${isOut?outList().length+' pengeluaran':list.length+' permintaan'} ditemukan · ${cat}</div><div class="tw">${repBody(list)}</div></div>`}
 const warn=S.ver!==EXPECT?'<div class="box" style="border-color:var(--no);color:var(--no)"><b>⚠ Deployment belum menggunakan API versi terbaru.</b> Deploy ulang project Vercel dengan file terbaru..</div>':'';
 $('app').innerHTML=warn+h}
load();loadVer();
